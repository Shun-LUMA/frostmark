name: Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Frontend checks
        run: |
          npm run build
          npx playwright test
      - name: Prepare WebView2 on the build runner
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP/WebView2Setup.exe"
          $setup = Start-Process "$env:RUNNER_TEMP/WebView2Setup.exe" -ArgumentList '/silent','/install' -Wait -PassThru
          Write-Host "WebView2 bootstrapper exit code: $($setup.ExitCode)"
          # WebView2's per-app policy is used only on this disposable runner.
          # Some runner environments ignore child-process browser-argument overrides.
          $debugPolicy = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $debugPolicy -Force | Out-Null
          New-ItemProperty -Path $debugPolicy -Name 'frostmark.exe' -PropertyType String -Value '--remote-debugging-port=9222' -Force | Out-Null
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol
      - name: Build portable executable (no installer)
        run: npm run tauri:build -- --no-bundle
      - name: Preserve compiled executable for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-executable
          path: src-tauri/target/release/frostmark.exe
          if-no-files-found: error
          retention-days: 3
      - name: Verify portable executable dependencies
        run: node scripts/verify-pe.mjs
      - name: Desktop smoke test
        run: node scripts/desktop-smoke.mjs
      - name: Collect third-party notices
        run: node scripts/third-party-notices.mjs
      - name: Package portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/Frostmark | Out-Null
          Copy-Item src-tauri/target/release/frostmark.exe artifacts/Frostmark/Frostmark.exe
          Copy-Item PORTABLE-README.txt artifacts/Frostmark/README.txt
          Copy-Item examples/welcome.md artifacts/Frostmark/Welcome.md
          Copy-Item artifacts/THIRD-PARTY-NOTICES.txt artifacts/Frostmark/THIRD-PARTY-NOTICES.txt
          Compress-Archive -Path artifacts/Frostmark -DestinationPath artifacts/Frostmark-windows-x64-portable.zip
          $hash = (Get-FileHash artifacts/Frostmark-windows-x64-portable.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Frostmark-windows-x64-portable.zip" | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Frostmark-windows-x64-portable
          path: |
            artifacts/Frostmark-windows-x64-portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-evidence
          path: test-results/
          if-no-files-found: ignore
