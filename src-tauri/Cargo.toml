[package]
name = "frostmark"
version = "0.1.0"
description = "A portable, read-only Markdown reader for Windows"
authors = ["Frostmark contributors"]
license = "MIT"
repository = "https://github.com/Shun-LUMA/frostmark"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Enables a debugger only in the separate CI test binary. Never package this feature.
desktop-test = []

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 8
